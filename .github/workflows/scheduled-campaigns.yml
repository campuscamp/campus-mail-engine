name: Scheduled Campaigns

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  process-scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for SMTP secrets
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "⚠️ SMTP_PASS not configured. Skipping scheduled campaigns."
            exit 0
          fi
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      - name: Process scheduled campaigns
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          DRY_RUN: 'true'
        run: |
          echo "=== Scheduled Campaign Processor ==="
          echo "Time: $(date)"
          echo "DRY_RUN: $DRY_RUN"
          echo "No scheduled campaigns configured yet."
          echo "Configure campaigns in config/ to enable."
