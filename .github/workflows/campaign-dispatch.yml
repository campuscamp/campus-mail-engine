name: Campaign Dispatch

on:
  workflow_dispatch:
    inputs:
      campaign_file:
        description: 'Campaign config JSON path'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (no actual sending)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      batch_size:
        description: 'Batch size per cycle'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate campaign config
        run: |
          if [ ! -f "${{ inputs.campaign_file }}" ]; then
            echo "❌ Campaign file not found: ${{ inputs.campaign_file }}"
            exit 1
          fi
          echo "✅ Campaign file found"
          cat "${{ inputs.campaign_file }}"

      - name: Run campaign
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          DRY_RUN: ${{ inputs.dry_run }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: node scripts/campaign-runner.js "${{ inputs.campaign_file }}"
