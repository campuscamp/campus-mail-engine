name: Send Test Email

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Test email recipient'
        required: true
        type: string
      subject:
        description: 'Email subject'
        required: false
        default: '🧪 CAMPUS Mail Engine — Test'
        type: string
      template:
        description: 'Template (newsletter, transactional, institutional)'
        required: false
        default: 'newsletter'
        type: string

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          DRY_RUN: 'false'
        run: node scripts/send-test.js "${{ inputs.recipient }}" "${{ inputs.subject }}"
