<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMPUS — Manifesto Ufficiale Reclutamento Docenti (A4 Stampabile)</title>
  <meta name="description" content="Manifesto ufficiale A4 per affissione in bacheca istituzionale e albo telematico di Ordini, Collegi e Associazioni di Categoria.">
  <link rel="icon" type="image/png" href="/assets/visual/Campus_Emblema_Transparent.png">
  
  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-light: #fcf6ba;
      --bg-black: #000000;
      --bg-card: #0a0a0a;
      --text-white: #ffffff;
      --text-muted: #b5b5b5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    /* ACTION BAR (NASCOSTA IN STAMPA) */
    .action-bar {
      position: sticky;
      top: 15px;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--gold-primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.25);
      border-radius: 8px;
      padding: 12px 24px;
      margin-bottom: 25px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-gold {
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      color: #000000 !important;
      box-shadow: 0 0 15px rgba(212,175,55,0.4);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(212,175,55,0.7);
    }

    .btn-outline {
      background: transparent;
      color: var(--gold-primary) !important;
      border: 1px solid var(--gold-primary);
    }
    .btn-outline:hover {
      background: rgba(212,175,55,0.12);
      color: #ffffff !important;
    }

    /* CONTENITORE MANIFESTO A4 */
    .sheet-wrapper {
      width: 100%;
      max-width: 820px;
      background: #000000;
      border: 2px solid var(--gold-primary);
      border-radius: 6px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 35px rgba(212,175,55,0.2);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* REGOLE DI STAMPA A4 */
    @media print {
      body {
        background: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .action-bar {
        display: none !important;
      }
      .sheet-wrapper {
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100vw !important;
        height: 100vh !important;
        border-radius: 0 !important;
      }
      .poster-img {
        width: 100% !important;
        height: 100% !important;
        object-fit: fill !important;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA AZIONI ISTITUZIONALI -->
  <div class="action-bar">
    <button onclick="window.print()" class="btn btn-gold">
      <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      Stampa Manifesto A4
    </button>
    <a href="/assets/docs/Manifesto_Ufficiale_Call_Docenti_A4.pdf" download="Manifesto_Ufficiale_CAMPUS_A4.pdf" class="btn btn-outline">
      <svg style="width: 16px; height: 16px; fill: #d4af37;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Scarica PDF Ufficiale
    </a>
    <a href="/faculty.php" class="btn btn-outline">
      <svg style="width: 16px; height: 16px; fill: #d4af37;" viewBox="0 0 24 24"><path d="M12 1L2 6v2h20V6L12 1zm-7 9v8h2v-8H5zm5 0v8h2v-8h-2zm5 0v8h2v-8h-2zm5 0v8h2v-8h-2zM2 20v2h20v-2H2z"/></svg>
      Portale Candidatura Faculty
    </a>
  </div>

  <!-- MANIFESTO UFFICIALE -->
  <div class="sheet-wrapper">
    <img src="/assets/visual/Manifesto_Ufficiale_Call_Docenti_A4.jpg" alt="Manifesto Ufficiale Bando Straordinario Reclutamento Docenti CAMPUS A.A. 2026/2027" class="poster-img">
  </div>

</body>
</html>
