<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f4f7; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; }
    .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 32px 24px; text-align: center; }
    .header h1 { color: #ffffff; font-size: 24px; margin: 0; font-weight: 700; letter-spacing: 2px; }
    .header p { color: #a0aec0; font-size: 12px; margin: 8px 0 0; letter-spacing: 1px; }
    .content { padding: 32px 24px; line-height: 1.6; }
    .content h2 { color: #1a1a2e; font-size: 20px; margin: 0 0 16px; }
    .content p { margin: 0 0 16px; color: #4a5568; }
    .btn { display: inline-block; padding: 12px 32px; background: #6366f1; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 600; margin: 16px 0; }
    .btn:hover { background: #4f46e5; }
    .footer { padding: 24px; background: #f7fafc; border-top: 1px solid #e2e8f0; text-align: center; font-size: 12px; color: #a0aec0; }
    .footer a { color: #a0aec0; text-decoration: underline; }
    @media (max-width: 600px) {
      .content { padding: 24px 16px; }
      .header { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CAMPUS</h1>
      <p>DISCERE · DOCERE · CRESCERE</p>
    </div>
    <div class="content">
      <h2>Ciao {{first_name}},</h2>
      <p>{{body}}</p>
      {{#if cta_url}}
      <p style="text-align:center;">
        <a href="{{cta_url}}" class="btn">{{cta_text}}</a>
      </p>
      {{/if}}
    </div>
    <div class="footer">
      <p><strong>CAMPUS</strong> · <a href="{{campus_url}}">campus.camp</a></p>
      <p>Ricevi questa email perché {{reason}}.</p>
      <p>
        <a href="{{unsubscribe_url}}">Cancella iscrizione</a> ·
        <a href="{{privacy_url}}">Privacy</a>
      </p>
    </div>
  </div>
</body>
</html>
